<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Entrar - Monitor TI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; font-family: 'Inter', sans-serif; background: #0f172a; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-box { background: white; padding: 40px; border-radius: 8px; width: 350px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        h2 { margin-top: 0; color: #1e293b; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #e2e8f0; border-radius: 6px; box-sizing: border-box; font-family: inherit; }
        button { width: 100%; padding: 12px; background: #3b82f6; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: #2563eb; }
        .error { color: #ef4444; margin-bottom: 15px; font-size: 0.9rem; background: #fef2f2; padding: 10px; border-radius: 4px; border: 1px solid #fee2e2; }
        a { color: #64748b; text-decoration: none; font-size: 0.85rem; margin-top: 20px; display: inline-block; }
        a:hover { color: #3b82f6; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Monitor TI</h2>
        {% if erro %}
        <div class="error">{{ erro }}</div>
        {% endif %}
        <form method="POST">
            <input type="text" name="user" placeholder="Usuário" required autofocus>
            <input type="password" name="pass" placeholder="Senha" required>
            <button type="submit">ENTRAR</button>
        </form>
        <a href="/">Voltar ao início</a>
    </div>
</body>
</html>
